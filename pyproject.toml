[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glisteel"
dynamic = ["version"]
description = "GLinting Steel: a racing game on OpenGLContext, driving a streamed 3D Tiles world"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["license.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Mike C. Fletcher", email = "mcfletch@vrplumber.com" }
]
keywords = ["game", "racing", "OpenGLContext", "OpenGL", "3D Tiles", "physics", "3D"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

# The engine renders and streams the world; omi_physics holds the car up. The
# tools that *make* a world are not a dependency of driving one.
dependencies = [
    "OpenGLContext[glfw]>=3.0.0a5",
    "omi_physics>=0.3.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
# There is deliberately no `bake` extra pulling in glisteel-editor. The editor
# requires the game -- it drives what it has just authored -- and a game that
# required its editor back would be a dependency cycle for a resolver to unpick
# and for a release to be sequenced around. `glisteel-bake` comes from
# installing glisteel-editor, which is what the bundle and the .deb do through
# `packaging/requirements-stack.txt`.
dev = ["pytest", "pytest-cov", "pytest-timeout", "ruff", "mypy"]

[project.urls]
Repository = "https://github.com/mcfletch/glisteel"

[project.scripts]
glisteel = "glisteel.game:main"
glisteel-diagnose = "glisteel.diagnose:main"

[tool.setuptools.dynamic]
version = { attr = "glisteel.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["glisteel*"]

# The vehicles ship with the game: they are ours, they are small, and a car
# fetched at first run is a car missing on a machine with no network. The
# script that builds them is tools/cars.py, which is not packaged.
[tool.setuptools.package-data]
# `packs.json` and the previews beside it are what a chooser needs *before* it
# downloads anything: a pack's own art is inside the archive being chosen, so a
# screen offering one has nothing to show it with otherwise. They are a document
# and four thumbnails -- 87 KB against the 88 MB they describe.
glisteel = ["assets/**/*.glb", "assets/**/CREDITS.md",
            "packs.json", "previews/*.jpg"]

[tool.openglcontext-checks]
# The OGC rules (openglcontext-checks) this project is clean of, held by
# the workspace preflight. The others join as the project reaches zero of
# each; the counts are in openglcontext/plans/DEFECT-PREVENTION.md.
select = ["OGC141", "OGC221", "OGC223"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # import ordering
    "UP",   # pyupgrade
    "BLE",  # no blind except
    "S110", # no silent try/except/pass
    "S112", # no silent try/except/continue
    "TRY400",  # an error logged from an except block carries its traceback
    "RUF012",  # a mutable class attribute is declared a ClassVar
    "RUF100",  # no noqa that silences nothing
    "PLC0415",  # imports at the top, save a cycle or an optional dependency
    "SLF001",  # no reaching into another object's private members
    "DTZ",  # datetimes carry their time zone
    "ARG",  # no parameter nothing reads, save one a protocol fixes
    "S102", "S202", "S301", "S307", "S310",  # no exec, unchecked tar extraction, pickle, eval or unchecked URL scheme
    "PGH003", "PGH004",  # a type: ignore or noqa names the codes it silences
    "PLE0604", "PLE0605",  # __all__ is a list or tuple of strings
]
ignore = [
    "E501",   # line too long -- kept readable by hand, as in the engine
    "E741",   # ambiguous name -- x/y/z read naturally as coordinates
    "UP031",  # percent formatting, as the engine uses throughout
]

[tool.ruff.lint.per-file-ignores]
# The autopilot's tests put each of its judgements -- the room a pass needs,
# the room behind a car it follows, where it aims, how it pulls out -- to the
# question directly, below the drive() that combines them.
"tests/test_driver.py" = ["SLF001"]

[tool.mypy]
# 3.12 rather than the 3.10 floor in ``requires-python``: numpy's own stubs use
# 3.12 type syntax, so checking against 3.10 fails before it reaches any code
# here. What the floor promises is checked by the test suite, which runs on it.
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
# Every definition states its types, and a body is checked rather than skipped:
# an unannotated parameter is `Any`, and an `Any` travelling through a call is
# a check that reports success without having compared anything.
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
# The package as well as the tests: the modules teach with worked examples, and
# an example nobody runs is documentation that drifts away from the code it
# describes without anything saying so.
testpaths = ["tests", "glisteel"]
addopts = "-ra --doctest-modules"
timeout = 300
# A lap of a circuit is seconds of simulation whatever the machine, and the
# handful of tests that drive one are most of what the suite costs. They are
# marked rather than removed -- what they measure is the point of the harness --
# so a working loop can be `-m "not slow"` and a full run is the default.
markers = [
    "slow: drives a whole lap or several; seconds rather than milliseconds",
]

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in glisteel/__init__.py, so name that file too: without it a version
# bump leaves uv answering with the previous number, and a dependent requiring
# the new one resolves against PyPI rather than this checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "glisteel/__init__.py" }]
