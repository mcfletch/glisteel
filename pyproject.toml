[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glisteel"
dynamic = ["version"]
description = "GLinting Steel: a racing game on OpenGLContext, driving a streamed 3D Tiles world"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["license.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Mike C. Fletcher", email = "mcfletch@vrplumber.com" }
]
keywords = ["game", "racing", "OpenGLContext", "OpenGL", "3D Tiles", "physics", "3D"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

# The engine renders and streams the world; omi_physics holds the car up. The
# tools that *make* a world are not a dependency of driving one.
dependencies = [
    "OpenGLContext[glfw]>=3.0.0a3",
    "omi_physics>=0.3.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
# Baking a world to drive, for a checkout with no world in it: `glisteel-bake`
# lives with the editor that authors one.
bake = ["glisteel-editor"]
dev = ["glisteel[bake]", "pytest", "pytest-cov", "pytest-timeout", "ruff", "mypy"]

[project.urls]
Repository = "https://github.com/mcfletch/glisteel"

[project.scripts]
glisteel = "glisteel.game:main"

[tool.setuptools.dynamic]
version = { attr = "glisteel.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["glisteel*"]

# The vehicles ship with the game: they are ours, they are small, and a car
# fetched at first run is a car missing on a machine with no network. The
# script that builds them is tools/cars.py, which is not packaged.
[tool.setuptools.package-data]
glisteel = ["assets/**/*.glb", "assets/**/CREDITS.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # import ordering
    "UP",   # pyupgrade
    "BLE",  # no blind except
    "S110", # no silent try/except/pass
]
ignore = [
    "E501",   # line too long -- kept readable by hand, as in the engine
    "E741",   # ambiguous name -- x/y/z read naturally as coordinates
    "UP031",  # percent formatting, as the engine uses throughout
]

[tool.ruff.lint.per-file-ignores]
# The entry module sets the OPENGLCONTEXT_* environment the engine reads at
# import time, so its imports deliberately are not all at the top.
"glisteel/game.py" = ["E402"]

[tool.mypy]
# 3.12 rather than the 3.10 floor in ``requires-python``: numpy's own stubs use
# 3.12 type syntax, so checking against 3.10 fails before it reaches any code
# here. What the floor promises is checked by the test suite, which runs on it.
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true

# The engine and the physics ship no ``py.typed``, so mypy has nothing to check
# their surface against. Saying so per package keeps the silence deliberate and
# narrow: anything *else* that cannot be resolved is still an error worth
# seeing, which a bare global ignore would hide.
[[tool.mypy.overrides]]
module = ["OpenGLContext.*", "OpenGLContext_editor.*", "omi_physics.*", "OpenGL.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.pytest.ini_options]
# The package as well as the tests: the modules teach with worked examples, and
# an example nobody runs is documentation that drifts away from the code it
# describes without anything saying so.
testpaths = ["tests", "glisteel"]
addopts = "-ra --doctest-modules"
timeout = 300
# A lap of a circuit is seconds of simulation whatever the machine, and the
# handful of tests that drive one are most of what the suite costs. They are
# marked rather than removed -- what they measure is the point of the harness --
# so a working loop can be `-m "not slow"` and a full run is the default.
markers = [
    "slow: drives a whole lap or several; seconds rather than milliseconds",
]

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in glisteel/__init__.py, so name that file too: without it a version
# bump leaves uv answering with the previous number, and a dependent requiring
# the new one resolves against PyPI rather than this checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "glisteel/__init__.py" }]
